[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-gap-analyzer"
version = "0.2.0"
description = "Competitor marketing GAP analysis tool: compare official selling points vs. Voice of Customer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "marketing-gap-analyzer contributors"}]
keywords = ["marketing-analysis", "competitor-intelligence", "voice-of-customer", "gap-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mgap = "marketing_gap.cli:main"

[project.urls]
Repository = "https://github.com/Scarlett9826/marketing-gap-analyzer-"
Issues = "https://github.com/Scarlett9826/marketing-gap-analyzer-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
