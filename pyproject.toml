[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-gap-analyzer"
version = "0.1.0"
description = "Competitor marketing GAP analysis tool: compare official selling points vs. Voice of Customer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
mgap = "marketing_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
